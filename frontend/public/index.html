<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./images/logo.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/2f837d206d.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Galindo&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Gluten:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="./stylesheets/screen.css" media="screen, projection" rel="stylesheet" type="text/css" />
  <link href="./stylesheets/print.css" media="print" rel="stylesheet" type="text/css" />
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <!--[if IE]>
        <link href="/stylesheets/ie.css" media="screen, projection" rel="stylesheet" type="text/css" />
    <![endif]-->
  <script>$(document).ready(function () {
    const videoOne = 'https://res.cloudinary.com/nuhippies/video/upload/v1645582427/Nu%20Hippies/Backgrounds/1071444757-preview_tVDvNS2l_pcdqnv.mp4'
    const videoTwo = 'https://res.cloudinary.com/nuhippies/video/upload/v1645931174/Nu%20Hippies/Backgrounds/gettyimages-1B03488_0004-640_adpp_tvq1yw.mp4'

    $('.home-logo').addClass('change-image');

      $('.close').mouseenter(function () {
        if (!window.matchMedia("(pointer: coarse)").matches) {
          $('.home-menu-ul').addClass('active');
        $('.home-title').addClass('title-color');
        $('.home-logo').removeClass('change-image');
        $('.flower').removeClass("bright")
        $('#left-video-source').attr('src', videoTwo);
        $('.home-left-banner').css('border', '3px solid #604ba0')
        $('.home-right-banner').css('border', '3px solid #604ba0')
        $('#right-video-source').attr('src', videoTwo);
        $('#left-video')[0].load()
        $('#right-video')[0].load()
      }
      })

      $('.close').click(function () {
        $('.home-menu-ul').toggleClass('active');
        $('.home-title').toggleClass('title-color');
        $('.flower').toggleClass('bright');
        $('.home-logo').toggleClass('change-image');
        if (document.getElementById('left-video-source').getAttribute('src') === videoOne) {
          $('#left-video-source').attr('src', videoTwo);
          $('#right-video-source').attr('src', videoTwo);
          $('.home-left-banner').css('border', '3px solid #604ba0')
          $('.home-right-banner').css('border', '3px solid #604ba0')
        } else {
          $('#left-video-source').attr('src', videoOne);
          $('#right-video-source').attr('src', videoOne);
          $('.home-left-banner').css('border', 'none')
          $('.home-right-banner').css('border', 'none')
        }
        $('#left-video')[0].load()
        $('#right-video')[0].load()
      })
    
      $('html').on('click touchstart', function (event) {
        if (event.target.id !== "ctrl-button") {
          return $('ul').removeClass('show-tip');
        }
      })

      $('.button.ctrl').click(function () {
      $('#main-menu-ul').toggleClass('show-tip');
    })
    
    })
    </script>
  <title>Nu Hippies</title>
</head>

<body>
  <div id="root"></div>
</body>

</html>
